services:
  - type: web
    name: status-academy-crm
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: ADMIN_PASSWORD
        sync: false   # parol Render sozlamalarida kiritiladi, kodda emas
      - key: DEADLINE_ISO
        value: 2026-09-16T17:42:00
